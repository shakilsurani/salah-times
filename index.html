<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auburn Central Musallah</title>

<!-- Makes "Add to Home Screen" launch without browser chrome. The manifest and
     icons only exist when this is served from a web host; opening index.html
     straight off a USB stick simply ignores the missing files. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musallah">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171a">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1b1f24;
    --muted: #6b727c;
    --line: #e3e6ea;
    --accent: #0f6b4f;
    --accent-soft: #e6f2ed;
    --warn: #8a5a00;
    --warn-soft: #fdf3e0;
    --error: #c0392b;
    --sun: #c2761a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --card: #1d2126;
      --ink: #e9ecef;
      --muted: #9aa2ac;
      --line: #2c3238;
      --accent: #4cc79c;
      --accent-soft: #1b2f28;
      --warn: #e5b96a;
      --warn-soft: #2e2617;
      --error: #ff8a7a;
      --sun: #e0a44a;
    }
  }

  * { box-sizing: border-box; }

  /* Nearly every size below is in rem, so the whole board scales by moving
     this one number - see the large-screen rules at the end. */
  html { font-size: 16px; }

  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    /* App-like rather than page-like: no rubber-band scroll, no grey flash on
       tap, and the board itself is not selectable text. */
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* The export block is the one thing that must stay selectable, so it can be
     copied into the file. */
  .export {
    -webkit-user-select: text;
    user-select: text;
  }

  main { width: 100%; max-width: 34rem; }

  header { margin-bottom: 1.25rem; }

  h1 {
    font-size: 1.5rem;
    margin: 0;
    text-align: center;
    letter-spacing: -.01em;
  }

  .dates {
    margin: .5rem 0 0;
    font-size: .95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    flex-wrap: wrap;
  }

  /* Live clock on the left, countdown to the next Iqamah on the right. */
  .strip {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    margin-top: .85rem;
    font-variant-numeric: tabular-nums;
  }

  .strip .label {
    display: block;
    font-size: .65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }

  .strip .value {
    font-size: 1.6rem;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -.02em;
  }

  .clock { text-align: left; }
  .clock .meridiem {
    font-size: .75rem;
    font-weight: 600;
    color: var(--muted);
    margin-left: .2rem;
  }

  .countdown { text-align: right; }
  .countdown .value { color: var(--accent); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  th, td { padding: .85rem 1rem; text-align: left; }

  thead th {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--line);
  }

  thead th:not(:first-child), tbody td:not(:first-child) { text-align: right; }

  tbody tr + tr td { border-top: 1px solid var(--line); }

  .name { font-weight: 600; }

  /* Arabic sits beside the English name. system-ui often has no Arabic cut, so
     name the faces that ship with Windows, Android and iOS explicitly. */
  .slash {
    margin: 0 .05rem 0 .4rem;
    color: var(--muted);
    font-weight: 400;
    opacity: .5;
  }

  .ar {
    margin-left: .35rem;
    font-family: "Segoe UI", "Noto Naskh Arabic", "Geeza Pro",
                 "Traditional Arabic", serif;
    font-size: 1em;
    font-weight: 500;
    color: var(--muted);
  }

  .start, .iqamah {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* The calculated start is context; the Iqamah time is what you act on. */
  .start { color: var(--muted); }
  .iqamah { font-weight: 600; }

  /* Juma listed below Isha on non-Fridays, as a standing reference. */
  tr.group-start td { border-top: 2px solid var(--line) !important; }

  tr.inactive .name, tr.inactive .iqamah { font-weight: 400; color: var(--muted); }
  tr.inactive .ar { opacity: .7; }

  tr.next { background: var(--accent-soft); }
  tr.next .name, tr.next .iqamah { color: var(--accent); }
  tr.next .ar { color: var(--accent); opacity: .75; }

  .badge {
    display: inline-block;
    margin-left: .5rem;
    padding: .1rem .45rem;
    border-radius: 999px;
    background: var(--accent);
    color: var(--card);
    font-size: .65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    vertical-align: .1em;
  }

  /* Sun times, under the table on the right. */
  .sun {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 1.4rem;
    margin-top: .85rem;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
  }

  .sun-item {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    white-space: nowrap;
  }

  .sun svg { width: 1.35em; height: 1.35em; fill: var(--sun); flex: none; }
  .sun-label { color: var(--muted); font-size: .85em; }
  .sun-time { font-weight: 600; }

  /* Kept deliberately faint and out of the way: nobody reading the board should
     notice them, but they are there for whoever maintains it. */
  .tools {
    position: fixed;
    left: .5rem;
    bottom: .5rem;
    z-index: 10;
    display: flex;
    gap: .35rem;
    opacity: .14;
  }

  .tools:hover, .tools:focus-within { opacity: 1; }

  @media (prefers-reduced-motion: no-preference) {
    .tools { transition: opacity .25s ease; }
  }

  .tool {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
  }

  .tool:hover { color: var(--ink); border-color: var(--muted); }
  .tool svg { width: 1.05em; height: 1.05em; fill: currentColor; }
  .tool[hidden] { display: none; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel {
    margin-top: .75rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }

  .panel[hidden], .note[hidden], .sun[hidden], .export[hidden] { display: none; }

  .panel h2 {
    margin: 0 0 .8rem;
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }

  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
    gap: .7rem;
  }

  .field label {
    display: block;
    margin-bottom: .2rem;
    font-size: .65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }

  .field input {
    width: 100%;
    padding: .4rem .5rem;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: .95rem;
    font-variant-numeric: tabular-nums;
  }

  .panel-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .9rem; }

  .panel-actions button {
    padding: .45rem .9rem;
    border-radius: 8px;
    border: 1px solid var(--line);
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
  }

  .panel-actions .primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--card);
  }

  .panel-actions .ghost { background: none; color: var(--muted); }
  .panel-actions .ghost:hover { color: var(--ink); }

  .export {
    width: 100%;
    margin-top: .8rem;
    padding: .6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: .75rem;
    line-height: 1.5;
    resize: vertical;
  }

  .panel-msg { margin: .7rem 0 0; font-size: .72rem; color: var(--muted); }
  .panel-msg.saved { color: var(--accent); font-weight: 600; }
  .panel-msg.problem { color: var(--error); }

  /* Shown when the embedded data is running out - this display is unattended,
     so it has to ask for attention well before it goes blank. */
  .note {
    margin: 1rem 0 0;
    padding: .6rem .9rem;
    border-radius: 8px;
    background: var(--warn-soft);
    color: var(--warn);
    text-align: center;
    font-size: .8rem;
  }

  .status { padding: 2rem 1.25rem; text-align: center; color: var(--muted); }
  .status.error { color: var(--error); }

  .status code {
    display: inline-block;
    margin-top: .5rem;
    padding: .2rem .45rem;
    border-radius: 5px;
    background: var(--bg);
    font-size: .85em;
  }

  /* Phones. 430px covers the current spread - iPhone SE 375, iPhone 14 390,
     Pixel 412, Pro Max 430 - so the three columns keep their breathing room
     without a time wrapping onto two lines. */
  @media (max-width: 430px) {
    body { padding: 1.25rem .6rem; }
    th, td { padding: .75rem .55rem; }
    h1 { font-size: 1.3rem; }
    .strip .value { font-size: 1.4rem; }
    .ar { margin-left: .3rem; font-size: .95em; }
    .slash { margin-left: .3rem; }
    .sun { justify-content: space-between; gap: .75rem; font-size: .95rem; }
  }

  /* Really narrow, or a phone in split view. */
  @media (max-width: 340px) {
    th, td { padding: .7rem .4rem; }
    .ar { display: none; }
  }

  /* Wall displays. Everything is in rem, so raising the root size scales the
     whole board together rather than leaving small text in a big frame. */
  @media (min-width: 1000px) and (min-height: 600px) {
    html { font-size: 20px; }
    main { max-width: 38rem; }
  }

  @media (min-width: 1500px) and (min-height: 800px) {
    html { font-size: 26px; }
    main { max-width: 42rem; }
  }

  @media (min-width: 2000px) and (min-height: 1100px) {
    html { font-size: 34px; }
  }

  /* A landscape screen is short on height - keep the board from overflowing. */
  @media (min-width: 1000px) and (orientation: landscape) and (max-height: 700px) {
    body { padding: 1rem; }
    html { font-size: 17px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Auburn Central Musallah</h1>
    <p class="dates" id="dates"></p>
    <div class="strip">
      <div class="clock">
        <span class="label">Now</span>
        <span class="value" id="clock">&nbsp;</span>
      </div>
      <div class="countdown">
        <span class="label" id="countdown-label">Next iqamah</span>
        <span class="value" id="countdown">&nbsp;</span>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="status" id="status">Loading&hellip;</div>
    <table id="table" hidden>
      <thead>
        <tr>
          <th scope="col">Prayer</th>
          <th scope="col">Start</th>
          <th scope="col">Iqamah</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="sun" id="sun" hidden></div>

  <div class="tools">
    <button type="button" class="tool" id="settings-toggle"
            aria-expanded="false" aria-controls="panel"
            aria-label="Iqamah times" title="Iqamah times">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94
        0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24
        0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47
        0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03
        1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7
        1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24
        1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12
        15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
    <button type="button" class="tool" id="fullscreen-toggle"
            aria-label="Full screen" title="Full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12
        7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>

  <div class="panel" id="panel" hidden>
    <h2>Iqamah times</h2>
    <div class="fields">
      <div class="field">
        <label for="in-Fajr">Fajr</label>
        <input type="time" id="in-Fajr">
      </div>
      <div class="field">
        <label for="in-Dhuhr">Dhuhr</label>
        <input type="time" id="in-Dhuhr">
      </div>
      <div class="field">
        <label for="in-Asr">Asr</label>
        <input type="time" id="in-Asr">
      </div>
      <div class="field">
        <label for="in-Isha">Isha</label>
        <input type="time" id="in-Isha">
      </div>
      <div class="field">
        <label for="in-juma1">Juma 1</label>
        <input type="time" id="in-juma1">
      </div>
      <div class="field">
        <label for="in-juma2">Juma 2</label>
        <input type="time" id="in-juma2">
      </div>
      <div class="field">
        <label for="in-maghrib">Maghrib +min</label>
        <input type="number" id="in-maghrib" min="0" max="90" step="1">
      </div>
    </div>
    <div class="panel-actions">
      <button type="button" class="primary" id="btn-export">Copy block for index.html</button>
      <button type="button" class="ghost" id="btn-reset">Reset</button>
    </div>
    <textarea class="export" id="export" rows="10" readonly hidden></textarea>
    <p class="panel-msg" id="panel-msg">
      Changes here preview on the page only. Iqamah times always come from
      index.html &mdash; copy the block into the file to keep them.
    </p>
  </div>

  <p class="note" id="note" hidden></p>
</main>

    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
  }

  // --- Model ----------------------------------------------------------------

  // On Friday the congregation prays Juma instead of Dhuhr, so the two Juma
  // slots take Dhuhr's place in the table and inherit its start time. On every
  // other day Dhuhr stands, and Juma is listed below Isha as a standing
  // reference so the times are always on the board.
  function buildRows(timings, day) {
    var friday = day.wd === FRIDAY;

    function jumaRow(n) {
      return {
        name: "Juma " + n,
        start: timings.Dhuhr,
        iqamah: settings["juma" + n],
        juma: true
      };
    }

    var daily = PRAYERS.map(function (name) {
      var start = timings[name];
      var iqamah = name === "Maghrib"
        ? fromMinutes(toMinutes(start) + settings.maghribOffset)
        : settings[name];
      return { name: name, start: start, iqamah: iqamah, juma: false };
    });

    daily.sort(function (a, b) { return toMinutes(a.start) - toMinutes(b.start); });

    var rows = [];
    daily.forEach(function (row) {
      if (friday && row.name === "Dhuhr") {
        rows.push(jumaRow(1), jumaRow(2));
      } else {
        rows.push(row);
      }
    });

    if (!friday) {
      var first = jumaRow(1);
      first.groupStart = true;
      rows.push(first, jumaRow(2));
    }
    return rows;
  }

  // Juma only counts on a Friday; on other days those rows are reference only.
  function isLive(row, day) {
    return row.juma ? day.wd === FRIDAY : true;
  }

  function ishaIqamahSeconds(rows) {
    var isha = rows.filter(function (r) { return r.name === "Isha"; })[0];
    return toSeconds(isha.iqamah);
  }

  // Returns the next Iqamah and how many seconds away it is. Keyed off the
  // Iqamah time rather than the calculated start - at 1pm Dhuhr has technically
  // begun, but its Iqamah is still ahead, so Dhuhr is what you are waiting on.
  // When the board has moved on to the next day's schedule, every Iqamah on it
  // is upcoming, so the countdown runs through the rest of tonight and into it.
  function nextIqamah(rows, isAhead, day) {
    var live = rows.filter(function (row) { return isLive(row, day); });
    live.sort(function (a, b) { return toSeconds(a.iqamah) - toSeconds(b.iqamah); });

    var now = sydneySecondsNow();

    if (isAhead) {
      return {
        row: live[0],
        seconds: (DAY_SECONDS - now) + toSeconds(live[0].iqamah)
      };
    }

    for (var i = 0; i < live.length; i++) {
      var at = toSeconds(live[i].iqamah);
      if (at > now) { return { row: live[i], seconds: at - now }; }
    }
    return { row: null, seconds: null };
  }

  // --- Rendering ------------------------------------------------------------

  function renderClock() {
    var p = sydneyParts();
    var h = parseInt(p.hour, 10) % 24;
    var h12 = h % 12;
    if (h12 === 0) { h12 = 12; }
    clockEl.innerHTML = h12 + ":" + p.minute + ":" + p.second +
      '<span class="meridiem">' + (h < 12 ? "am" : "pm") + "</span>";
  }

  function renderCountdown(next) {
    if (!next || !next.row) {
      countdownLabelEl.textContent = "Next iqamah";
      countdownEl.textContent = "—";
      return;
    }
    countdownLabelEl.textContent = next.row.name + " iqamah in";
    countdownEl.textContent = formatDuration(next.seconds);
  }

  // Always the wall-clock date, never the date of the schedule on screen. Once
  // the last iqamah has passed the board moves on to the next day's times, but
  // the date itself is left alone until midnight.
  function renderHeader(today) {
    datesEl.innerHTML = "<span>" + WEEKDAYS[today.wd] + ", " +
      readableDate(today) + "</span>";
  }

  // Sun over a horizon with an arrow: up for sunrise, down for sunset.
  var HORIZON = "M2 18.2h20v1.8H2z";
  var DOME = "M7 16a5 5 0 0 1 10 0H7z";

  function sunIcon(rising) {
    var arrow = rising
      ? "M12 2.2l4 4h-2.9V10h-2.2V6.2H8l4-4z"
      : "M12 10.2l-4-4h2.9V2.4h2.2v3.8H16l-4 4z";
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + arrow +
      '"/><path d="' + DOME + '"/><path d="' + HORIZON + '"/></svg>';
  }

  function sunItem(rising, label, time) {
    return '<span class="sun-item">' + sunIcon(rising) +
      '<span class="sun-label">' + label + "</span>" +
      '<span class="sun-time">' + to12Hour(time) + "</span></span>";
  }

  function renderSun(timings) {
    sunEl.hidden = false;
    sunEl.innerHTML = sunItem(true, "Sunrise", timings.Sunrise) +
      sunItem(false, "Sunset", timings.Sunset);
  }

  function cell(className, text) {
    var td = document.createElement("td");
    td.className = className;
    td.textContent = text;
    return td;
  }

  function renderRows(rows, nextRow, day) {
    tbodyEl.innerHTML = "";
    rows.forEach(function (row) {
      var classes = [];
      if (!isLive(row, day)) { classes.push("inactive"); }
      if (row.groupStart) { classes.push("group-start"); }
      if (row === nextRow) { classes.push("next"); }

      var tr = document.createElement("tr");
      tr.className = classes.join(" ");

      var nameCell = cell("name", row.name);

      // A separate LTR element, not an ::before on the Arabic span - inside an
      // RTL span the slash would render on the wrong side.
      var slash = document.createElement("span");
      slash.className = "slash";
      slash.textContent = "/";
      nameCell.appendChild(slash);

      var arabic = document.createElement("span");
      arabic.className = "ar";
      arabic.setAttribute("dir", "rtl");
      arabic.setAttribute("lang", "ar");
      arabic.textContent = ARABIC[row.name] || "";
      nameCell.appendChild(arabic);

      if (row === nextRow) {
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Next";
        nameCell.appendChild(badge);
      }

      tr.appendChild(nameCell);
      tr.appendChild(cell("start", to12Hour(row.start)));
      tr.appendChild(cell("iqamah", to12Hour(row.iqamah)));
      tbodyEl.appendChild(tr);
    });
  }

  function renderExpiryNote(today) {
    var left = daysOfDataLeft(today);
    if (left > EXPIRY_WARNING_DAYS) {
      noteEl.hidden = true;
      return;
    }
    noteEl.hidden = false;
    noteEl.textContent = left >= 0
      ? "Prayer times end 31 Dec " + TIMES_RANGE.to + " (" + left +
        " days left). Run build-times.js on an internet-connected machine and " +
        "copy this file back across."
      : "Prayer times ran out on 31 Dec " + TIMES_RANGE.to + ".";
  }

  // Nothing can be shown for a date outside the baked range, so say exactly
  // what to do about it rather than sitting blank.
  function showOutOfRange(day) {
    statusEl.className = "status error";
    statusEl.innerHTML =
      "No prayer times for " + readableDate(day) + ".<br>This file covers " +
      TIMES_RANGE.from + " to " + TIMES_RANGE.to + ". Regenerate it with:" +
      "<br><code>node build-times.js " + day.y + " " + (day.y + 9) + "</code>";
    statusEl.hidden = false;
    tableEl.hidden = true;
    sunEl.hidden = true;
    noteEl.hidden = true;
  }

  // --- State ----------------------------------------------------------------

  var state = {
    rows: null,        // rows currently on screen
    day: null,         // the day object those rows belong to
    isAhead: false,    // true while showing the next day's schedule, pre-midnight
    nextName: null     // highlighted row, tracked to avoid needless redraws
  };

  function show(day, isAhead) {
    var timings = lookup(day);
    if (!timings) { showOutOfRange(day); return false; }

    state.rows = buildRows(timings, day);
    state.day = day;
    state.isAhead = isAhead;

    var next = nextIqamah(state.rows, isAhead, day);
    state.nextName = next.row ? next.row.name : null;

    renderHeader(sydneyDay(0));
    renderRows(state.rows, next.row, day);
    renderCountdown(next);
    renderSun(timings);

    statusEl.hidden = true;
    tableEl.hidden = false;
    return true;
  }

  // --- Settings panel wiring ------------------------------------------------

  var INPUTS = {
    Fajr: "in-Fajr", Dhuhr: "in-Dhuhr", Asr: "in-Asr", Isha: "in-Isha",
    juma1: "in-juma1", juma2: "in-juma2", maghribOffset: "in-maghrib"
  };

  var LABELS = { juma1: "Juma 1", juma2: "Juma 2", maghribOffset: "Maghrib +min" };

  function fillPanel() {
    Object.keys(INPUTS).forEach(function (key) {
      document.getElementById(INPUTS[key]).value = settings[key];
    });
  }

  function message(text, kind) {
    panelMsgEl.textContent = text;
    panelMsgEl.className = "panel-msg" + (kind ? " " + kind : "");
  }

  function repaint() {
    fillPanel();
    if (state.day) { show(state.day, state.isAhead); }
  }

  // Reads the form. Anything unreadable keeps its current value and is named
  // back to the user rather than being silently coerced.
  function readPanel() {
    var next = {};
    var bad = [];

    Object.keys(INPUTS).forEach(function (key) {
      var raw = document.getElementById(INPUTS[key]).value;
      if (key === "maghribOffset") {
        var n = parseInt(raw, 10);
        if (isNaN(n) || n < 0 || n > 90) { bad.push(LABELS[key]); n = settings[key]; }
        next[key] = n;
      } else if (isTimeString(raw)) {
        next[key] = raw;
      } else {
        bad.push(LABELS[key] || key);
        next[key] = settings[key];
      }
    });

    return { values: next, bad: bad };
  }

  // Typing in a field previews it on the table straight away, so the times can
  // be judged in place before the block is copied into the file.
  Object.keys(INPUTS).forEach(function (key) {
    document.getElementById(INPUTS[key]).addEventListener("change", function () {
      var read = readPanel();
      settings = read.values;
      repaint();
      exportEl.hidden = true;
      message(read.bad.length
        ? "Could not read: " + read.bad.join(", ") + ". Left unchanged."
        : "Previewing. Copy the block into index.html to keep these times.",
        read.bad.length ? "problem" : null);
    });
  });

  document.getElementById("btn-export").addEventListener("click", function () {
    var read = readPanel();
    settings = read.values;
    repaint();

    exportEl.hidden = false;
    exportEl.value = exportBlock(settings);
    exportEl.focus();
    exportEl.select();
    message(read.bad.length
      ? "Could not read: " + read.bad.join(", ") + ". The block below uses the " +
        "previous values for those."
      : "Replace the DEFAULTS block in index.html with this, then copy the " +
        "file to every device.", read.bad.length ? "problem" : null);
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    settings = withDefaults();
    exportEl.hidden = true;
    repaint();
    message("Back to the times set in index.html.", "saved");
  });

  toggleEl.addEventListener("click", function () {
    var open = panelEl.hidden;
    panelEl.hidden = !open;
    toggleEl.setAttribute("aria-expanded", String(open));
    if (open) {
      fillPanel();
      exportEl.hidden = true;
      message("Changes here preview on the page only. Iqamah times always come " +
        "from index.html — copy the block into the file to keep them.");
    }
  });

  // --- Tick -----------------------------------------------------------------

  function tick() {
    renderClock();

    var today = sydneyDay(0);
    renderExpiryNote(today);

    if (!state.rows) {
      show(today, false);
      return;
    }

    if (state.isAhead) {
      // Midnight: the schedule already on screen is simply today's now, so all
      // that changes is the date in the header.
      if (dayId(today) === dayId(state.day)) {
        show(today, false);
        return;
      }
      // Asleep, or the clock jumped - the loaded day is no longer tomorrow.
      if (dayId(sydneyDay(1)) !== dayId(state.day)) {
        show(today, false);
        return;
      }
    } else {
      // The device was asleep, or the clock jumped: resync to whatever day it is.
      if (dayId(today) !== dayId(state.day)) {
        show(today, false);
        return;
      }

      // Today's last iqamah has passed, so load tomorrow's times straight away.
      // The header keeps today's date until midnight.
      if (sydneySecondsNow() >= ishaIqamahSeconds(state.rows)) {
        show(sydneyDay(1), true);
        return;
      }
    }

    var next = nextIqamah(state.rows, state.isAhead, state.day);
    renderCountdown(next);

    // Only rebuild the table when the highlighted prayer actually changes;
    // redrawing every second would fight with text selection.
    var name = next.row ? next.row.name : null;
    if (name !== state.nextName) {
      state.nextName = name;
      renderRows(state.rows, next.row, state.day);
    }
  }

  // --- Full screen ----------------------------------------------------------
  // The wall display wants no browser chrome at all. iPhone Safari has no
  // Fullscreen API, so the button hides itself there and "Add to Home Screen"
  // is the route instead.

  (function () {
    var btn = document.getElementById("fullscreen-toggle");
    var root = document.documentElement || {};
    var request = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!btn || !request) { return; }

    btn.hidden = false;

    function active() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }

    // Full screen is the wall-display mode, so the settings button goes away
    // entirely - and the panel with it, if it happened to be open.
    function sync() {
      var on = !!active();
      var text = on ? "Exit full screen" : "Full screen";
      btn.setAttribute("title", text);
      btn.setAttribute("aria-label", text);

      toggleEl.hidden = on;
      if (on && !panelEl.hidden) {
        panelEl.hidden = true;
        toggleEl.setAttribute("aria-expanded", "false");
      }
    }

    btn.addEventListener("click", function () {
      if (active()) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) { exit.call(document); }
      } else {
        request.call(root);
      }
    });

    if (document.addEventListener) {
      document.addEventListener("fullscreenchange", sync);
      document.addEventListener("webkitfullscreenchange", sync);
    }
    sync();
  }());

  settings = withDefaults();
  fillPanel();
  tick();
  setInterval(tick, 1000);
}());
</script>
</body>
</html>
